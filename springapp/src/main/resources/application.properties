# ===============================
# Application
# ===============================
spring.application.name=springapp

# ===============================
# MySQL Database
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/quizdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=QuizManagementApplicationSecretKey12345678901234567890
jwt.expiration=86400000
# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# File Upload Configuration
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=250MB
file.upload-dir=uploads

# ===============================
# Proctoring Configuration
# ===============================
proctoring.screenshot.enabled=true
proctoring.screenshot.interval=5000
proctoring.screenshot.max-size=2097152
proctoring.screenshot.storage-type=database
proctoring.screenshot.retention-days=30
proctoring.screenshot.dir=uploads/proctoring
